[project]
name = "sesamoback"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.135.1",
    "fernet>=1.0.1",
    "passlib>=1.7.4",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.11.0",
    "pymysql[rsa]>=1.1.2",
    "python-multipart>=0.0.22",
    "pytz>=2026.1.post1",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: Isolated unit tests",
    "system: End-to-end system and business workflow tests",
    "usability: API usability, developer experience (DX) and documentation ergonomics tests",
]
